# Full self-hosted stack: n8n + Postgres (chat memory) + SearXNG (web search) + ngrok (public HTTPS)
# Usage:  cp .env.example .env  (fill in values)  ->  docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      - WEBHOOK_URL=https://${NGROK_DOMAIN}/
      - N8N_HOST=${NGROK_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - searxng

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n_memory
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --url=https://${NGROK_DOMAIN} n8n:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - n8n
